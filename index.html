or:#d5d8df;margin-top:12px}
.toast{position:fixed;z-index:20;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:12px 16px;border-radius:12px;background:#f4efe5;color:#19140f;font-weight:850;font-size:12px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}.hidden{display:none!important}.shake{animation:shake .3s ease}@keyframes shake{25%,75%{transform:translateX(-4px)}50%{transform:translateX(4px)}}.confetti{position:fixed;z-index:9;pointer-events:none;top:-20px;width:7px;height:13px;background:var(--gold);animation:confettiFall 1.8s linear forwards}@keyframes confettiFall{to{transform:translate3d(var(--drift),110vh,0) rotate(720deg);opacity:0}}.modal-backdrop{position:fixed;inset:0;z-index:30;background:#08090dcc;display:grid;place-items:center;padding:20px}.modal{width:min(100%,440px);background:#1b1d25;border:1px solid #ffffff21;border-radius:20px;padding:22px;box-shadow:var(--shadow)}.modal h2{font-size:25px;margin:0 0 10px;letter-spacing:-.04em}.modal p,.modal li{font-size:13px;line-height:1.6;color:#b7bbc6}.modal ul{padding-left:19px}.modal .primary{margin-top:10px}

/* COURTSIDE CUT: the camera travels; the interface does not merely swap cards. */
body{background:#090b0e}
.court-lines,.orb{display:none}
.topbar{border-bottom-color:#ffffff0a}
.brand-mark{border-radius:50%;box-shadow:0 0 0 5px #ff762912,0 0 25px #ff762922}
.screen{animation:screenIn .24s cubic-bezier(.2,.8,.2,1) both}
.prompt-card{background:linear-gradient(160deg,#1d2025,#121418 75%);border-radius:5px 22px 22px 22px;border-top:3px solid var(--orange);box-shadow:0 18px 55px #0009, inset 0 1px #ffffff0b}
.prompt-card h2{font-weight:850;letter-spacing:-.055em}
.answer-input{border-radius:8px;background:#0d0f12;border-color:#363b40}
.submit-btn{border-radius:8px;box-shadow:none}
.primary{box-shadow:none;border-radius:8px;letter-spacing:.045em}
.secondary,.ghost{border-radius:8px}
/* Between plays: a first-person sprint down the floor, not a page fade. */
.transition-overlay{position:fixed;inset:0;z-index:100;overflow:hidden;pointer-events:none;background:#090b0e;perspective:420px;isolation:isolate;animation:transitionOut .92s cubic-bezier(.6,0,.85,.3) forwards}
.transition-crowd{position:absolute;inset:-12%;background:repeating-linear-gradient(90deg,transparent 0 11px,#d9d2c71a 12px 14px,transparent 15px 29px),linear-gradient(#08090c 0 28%,#1d2027 28% 43%,#7a3d20 43% 100%);filter:blur(1.5px);transform:scale(1.1);animation:crowdRush .92s ease-in both}
.transition-crowd:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 7%,#ffdbb01c 7.2% 7.5%,transparent 7.7% 13%);transform:scaleX(1.3);animation:standsStreak .92s ease-in both}
.transition-crowd:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 37%,#f5a66c4a,transparent 46%),linear-gradient(90deg,#050608d9,transparent 22% 78%,#050608d9)}
.transition-floor{position:absolute;left:-55%;width:210%;height:82%;bottom:-8%;transform:rotateX(61deg);transform-origin:bottom;background:repeating-linear-gradient(0deg,transparent 0 36px,#f5c9a27a 37px 39px,transparent 40px 75px),linear-gradient(90deg,transparent 49.65%,#ffe0bd9c 49.85% 50.15%,transparent 50.35%),linear-gradient(135deg,#a65b32,#482519 52%,#98502a);box-shadow:0 -12px 60px #ff762944;animation:floorRush .92s cubic-bezier(.12,.65,.2,1) both}
.transition-circle{position:absolute;width:min(65vw,340px);height:min(65vw,340px);border:3px solid #f1c7a099;border-radius:50%;left:50%;top:56%;transform:translate(-50%,-50%);box-shadow:0 0 0 22px #f1c7a011,0 0 0 48px #f1c7a00a;animation:circleRush .92s cubic-bezier(.1,.65,.2,1) both}
.transition-label{position:absolute;left:0;right:0;top:28%;text-align:center;font-size:clamp(12px,3.3vw,16px);font-weight:1000;letter-spacing:.28em;color:#fff4e7;text-shadow:0 3px 24px #000;animation:labelRush .92s ease-in both}
.transition-overlay:after{content:"";position:absolute;inset:-30%;background:repeating-linear-gradient(105deg,transparent 0 9%,#fff3e70a 9.2% 9.5%,transparent 9.7% 17%);animation:peripheralStreak .92s ease-in both}
@keyframes floorRush{0%{transform:rotateX(61deg) translateY(0) scale(1)}55%{transform:rotateX(61deg) translateY(18%) scale(1.45)}100%{transform:rotateX(61deg) translateY(54%) scale(2.35)}}
@keyframes crowdRush{0%{transform:scale(1.03)}100%{transform:scale(1.45) translateY(4%)}}
@keyframes standsStreak{0%{transform:scaleX(1)}100%{transform:scaleX(2.7)}}
@keyframes peripheralStreak{0%{opacity:0;transform:scale(.7)}30%{opacity:.9}100%{opacity:0;transform:scale(1.7)}}
@keyframes circleRush{0%{transform:translate(-50%,-50%) scale(.15);opacity:0}20%{opacity:.8}100%{transform:translate(-50%,-50%) scale(3.3);opacity:0}}
@keyframes labelRush{0%{transform:scale(.65);opacity:0}15%{opacity:1}75%{transform:scale(1.2);opacity:1}100%{transform:scale(2.4);opacity:0}}
@keyframes transitionOut{0%{opacity:1;filter:blur(0)}78%{opacity:1;filter:blur(1px)}100%{opacity:0;filter:blur(7px)}}
/* Answer sequence: the camera follows the release from the player's hands to the rim. */
.shot-wrap{position:fixed;z-index:90;inset:0;width:100vw;height:100dvh;margin:0;overflow:hidden;display:block;background:radial-gradient(ellipse at 50% 30%,#3b2d24 0,#16191e 48%,#08090b 100%);pointer-events:auto;animation:cameraRecoil 1.45s cubic-bezier(.2,.75,.2,1) forwards}
.shot-wrap:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 5px,#ffffff05 6px 7px),radial-gradient(ellipse at 50% 100%,#b86b3b55,transparent 50%);animation:arenaFlash 1.45s ease-out both}.shot-wrap:after{pointer-events:none}.shot-wrap .pov-floor{position:absolute;left:-45%;width:190%;height:55%;bottom:-4%;transform:perspective(420px) rotateX(62deg);transform-origin:bottom;background:repeating-linear-gradient(0deg,transparent 0 30px,#f3c49a55 31px 33px,transparent 34px 64px),linear-gradient(90deg,transparent 49.7%,#f3c49a88 49.9% 50.1%,transparent 50.3%),linear-gradient(100deg,#6c371f,#b76b3a 48%,#4b2718);animation:playerFloorRush 1.2s cubic-bezier(.2,.65,.2,1) both}.shot-wrap .pov-hands{position:absolute;z-index:2;left:0;right:0;bottom:-3%;width:100%;height:47%;overflow:visible;filter:drop-shadow(0 15px 12px #0008);transform-origin:50% 100%;animation:bodyFollow 1.1s cubic-bezier(.2,.65,.2,1) both}.shot-wrap .pov-hands path{fill:#17191d;stroke:#36383b;stroke-width:2}.shot-wrap .pov-hands .jersey{fill:#f0e5d8;stroke:#b7a89b;stroke-width:2}.shot-wrap .pov-hands .skin{fill:#9b6245;stroke:#603821;stroke-width:2}
.shot-wrap .hoop-svg{inset:0;width:100%;height:100%;opacity:0;animation:hoopRush 1.45s cubic-bezier(.15,.75,.2,1) both}
.shot-wrap .hoop-svg .court-floor{opacity:1}
.shot-ball{width:clamp(78px,22vw,150px);height:clamp(78px,22vw,150px);left:calc(50% - clamp(39px,11vw,75px));top:calc(100% - clamp(145px,27vh,230px));opacity:0;background:radial-gradient(circle at 27% 22%,#ffcf8c 0,#f98a32 39%,#b54b19 75%,#57220f 100%);border:3px solid #59250f;box-shadow:inset -15px -16px 24px #4b1d0d88,inset 7px 5px 10px #ffe0a966,0 18px 45px #0009}
.shot-ball:before,.shot-ball:after{border-width:3px;border-color:#672a12}
.shot-wrap.shooting .shot-ball{opacity:1;animation:playerRelease 1.05s cubic-bezier(.16,.74,.2,1) .04s forwards}
@keyframes playerRelease{0%{transform:translate(0,0) scale(1.18) rotate(0);opacity:1}12%{transform:translate(-3vw,-5vh) scale(1.28) rotate(48deg);opacity:1}29%{transform:translate(2vw,-17vh) scale(1.05) rotate(170deg);opacity:1}48%{transform:translate(0,-35vh) scale(.75) rotate(330deg);opacity:1}68%{transform:translate(1vw,-50vh) scale(.42) rotate(510deg);opacity:1}84%{transform:translate(0,-54vh) scale(.23) rotate(670deg);opacity:1}100%{transform:translate(0,-54vh) scale(.12) rotate(740deg);opacity:0}}
@keyframes playerFloorRush{0%{transform:perspective(420px) rotateX(62deg) scale(1) translateY(0)}45%{transform:perspective(420px) rotateX(62deg) scale(1.2) translateY(8%)}100%{transform:perspective(420px) rotateX(62deg) scale(1.75) translateY(24%)}}
@keyframes bodyFollow{0%{transform:translateY(8%) scale(1.12)}22%{transform:translateY(0) scale(1)}52%{transform:translateY(5%) scale(1.04)}100%{transform:translateY(12%) scale(1.08)}}
@keyframes hoopRush{0%{opacity:0;transform:scale(.45) translateY(18%)}28%{opacity:.5}62%{opacity:1;transform:scale(1.05) translateY(0)}100%{opacity:1;transform:scale(1.08) translateY(-1%)}}
@keyframes cameraRecoil{0%{transform:scale(1.18) rotate(-1.5deg);filter:blur(4px);opacity:0}10%{opacity:1;filter:blur(0)}35%{transform:scale(1) rotate(0)}64%{transform:scale(1.08) rotate(.7deg)}100%{transform:scale(1.28) rotate(0);opacity:0;filter:blur(5px)}}
@keyframes arenaFlash{0%,100%{opacity:.15}25%{opacity:.8}46%{opacity:.15}60%{opacity:.65}80%{opacity:.1}}
.shot-wrap.make:after,.shot-wrap.legendary:after{position:absolute;z-index:3;top:20%;left:0;right:0;text-align:center;font-size:clamp(32px,10vw,66px);font-weight:1000;font-style:italic;letter-spacing:-.06em;color:#fff5e9;text-shadow:0 4px 0 #71371f,0 0 40px #ff7629;animation:impactWord .9s .35s cubic-bezier(.12,.85,.18,1) both}
.shot-wrap.make:after{content:"GOOD.\A RIGHT IN.";white-space:pre;line-height:.92}
.shot-wrap.legendary:after{content:"FROM\A WAY OUT.";white-space:pre;line-height:.92;color:#ffd166;text-shadow:0 4px 0 #793d1a,0 0 55px #ffd166}
.shot-wrap.miss:after{content:"OFF THE IRON.";position:absolute;top:22%;left:0;right:0;text-align:center;font-size:clamp(26px,8vw,54px);font-weight:1000;font-style:italic;letter-spacing:-.06em;color:#f5e8db;animation:impactWord .7s .25s both}
@keyframes impactWord{0%{transform:translateY(28px) scale(.7) skewX(-8deg);opacity:0}45%{transform:translateY(-5px) scale(1.08) skewX(0);opacity:1}65%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-20px) scale(1.12);opacity:0}}
body.camera-hit{animation:bodyHit .22s .5s ease-out both}
@keyframes bodyHit{0%{transform:scale(1)}35%{transform:scale(1.012) translateX(-2px)}70%{transform:scale(1.006) translateX(2px)}100%{transform:scale(1)}}
.result-card{border-radius:8px;background:#15181c;border-left:3px solid var(--orange)}
.result-card h2{font-weight:850;letter-spacing:-.05em}
.result-actions{margin-top:18px}
@media(prefers-reduced-motion:reduce){.transition-overlay,.shot-wrap,.shot-wrap .shot-ball,.shot-wrap .hoop-svg{animation-duration:.01ms!important}}


/* Unified possession transition: the same full-screen court is used for score reveals and travel to the next prompt. */
.transition-overlay{position:fixed;inset:0;z-index:100;overflow:hidden;pointer-events:none;background:#08090b;perspective:900px;isolation:isolate;animation:sequenceFade 3.35s cubic-bezier(.2,.7,.25,1) both}
.transition-overlay.is-answer{pointer-events:auto;animation:none}
.transition-crowd{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,#e2b58a22,transparent 42%),linear-gradient(#080a0d 0 21%,#17191f 21% 43%,#111215 43%);animation:standsPush 3.35s cubic-bezier(.2,.7,.25,1) both}
.transition-crowd:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,#d5c9b21c 23px 25px,transparent 26px 46px);mask-image:linear-gradient(#000 0 45%,transparent 78%);animation:standsPan 3.35s ease-in-out both}
.transition-crowd:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 33%,#ffcf8b22,transparent 54%),linear-gradient(90deg,#050608a8,transparent 20% 80%,#050608a8)}
.transition-floor{position:absolute;left:-70%;width:240%;height:75%;bottom:-9%;transform:rotateX(66deg);transform-origin:bottom;background:repeating-linear-gradient(0deg,transparent 0 42px,#f5d1ac66 43px 45px,transparent 46px 86px),linear-gradient(90deg,transparent 49.5%,#f8d9b5aa 49.8% 50.2%,transparent 50.5%),linear-gradient(90deg,#6b351e,#b76b3a 50%,#6b351e);box-shadow:0 -15px 70px #ff762922;animation:floorTravel 3.35s cubic-bezier(.16,.65,.2,1) both}
.transition-circle{position:absolute;left:50%;top:67%;width:min(84vw,460px);aspect-ratio:1;border:3px solid #f1c7a088;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 24px #f1c7a010,0 0 0 54px #f1c7a008;animation:centerCourt 3.35s cubic-bezier(.2,.7,.25,1) both}
.transition-label{position:absolute;z-index:5;left:0;right:0;top:10%;padding:0 18px;text-align:center;font-size:11px;font-weight:1000;letter-spacing:.24em;color:#f7eadd;text-shadow:0 3px 24px #000;animation:labelSettle .5s ease-out both}
.transition-backboard{position:absolute;z-index:2;left:50%;top:20%;width:clamp(112px,31vw,170px);height:clamp(80px,22vw,120px);border:4px solid #e7e1d6;border-radius:3px;transform:translateX(-50%);background:#dbe6e608;box-shadow:0 0 24px #fff2;animation:backboardTravel 3.35s cubic-bezier(.2,.7,.25,1) both}
.transition-backboard:before{content:"";position:absolute;left:27%;right:27%;bottom:8%;height:37%;border:3px solid #e7e1d6}
.transition-rim{position:absolute;z-index:4;left:50%;top:calc(20% + clamp(75px,20vw,113px));width:clamp(80px,24vw,132px);height:22px;border:7px solid #ff7629;border-top:0;border-radius:0 0 50% 50%;transform:translateX(-50%) perspective(100px) rotateX(-9deg);filter:drop-shadow(0 0 9px #ff762955);animation:rimTravel 3.35s cubic-bezier(.2,.7,.25,1) both}
.transition-net{position:absolute;z-index:3;left:50%;top:calc(20% + clamp(91px,24vw,130px));width:clamp(65px,19vw,105px);height:clamp(48px,14vw,76px);transform:translateX(-50%);background:repeating-linear-gradient(76deg,transparent 0 12px,#eee2d388 13px 14px,transparent 15px 25px),repeating-linear-gradient(-76deg,transparent 0 12px,#eee2d388 13px 14px,transparent 15px 25px);clip-path:polygon(0 0,100% 0,72% 100%,28% 100%);animation:netTravel 3.35s ease both}
.transition-player{position:absolute;z-index:3;left:50%;bottom:-3%;width:clamp(150px,44vw,240px);height:42%;transform:translateX(-50%);transform-origin:50% 100%;background:linear-gradient(90deg,transparent 0 14%,#d9d2c6 14% 28%,#24272b 28% 72%,#d9d2c6 72% 86%,transparent 86%);clip-path:polygon(24% 100%,16% 40%,24% 22%,38% 18%,42% 0,58% 0,62% 18%,76% 22%,84% 40%,76% 100%);filter:drop-shadow(0 0 20px #0009);animation:playerDrive 3.35s cubic-bezier(.18,.7,.2,1) both}
.transition-ball{position:absolute;z-index:6;left:50%;bottom:17%;width:clamp(42px,12vw,68px);aspect-ratio:1;border-radius:50%;border:2px solid #6c2b10;background:radial-gradient(circle at 28% 24%,#ffd293,#ff8a32 48%,#ad4519 85%);box-shadow:inset -8px -8px 11px #57200d88,0 12px 25px #0009;transform:translateX(-50%);animation:ballJumper 3.35s cubic-bezier(.16,.72,.2,1) both}
.transition-ball:before,.transition-ball:after{content:"";position:absolute;inset:0;border:2px solid #6c2b10;border-radius:50%}.transition-ball:before{left:34%;right:34%}.transition-ball:after{top:42%;bottom:42%}
.transition-overlay.score-0 .transition-ball{animation-name:ballMiss}.transition-overlay.score-1 .transition-ball{animation-name:ballLayup}.transition-overlay.score-2 .transition-ball{animation-name:ballLayup}.transition-overlay.score-3 .transition-ball{animation-name:ballJumper}.transition-overlay.score-4 .transition-ball{animation-name:ballThree}.transition-overlay.score-5 .transition-ball{animation-name:ballDeepThree}.transition-overlay.score-6 .transition-ball{animation-name:ballDunk}
.transition-overlay.score-1 .transition-player,.transition-overlay.score-2 .transition-player{animation-name:playerLayup}.transition-overlay.score-3 .transition-player{animation-name:playerJumper}.transition-overlay.score-4 .transition-player,.transition-overlay.score-5 .transition-player{animation-name:playerThree}.transition-overlay.score-6 .transition-player{animation-name:playerDunk}
.transition-impact{position:absolute;z-index:8;top:43%;left:0;right:0;text-align:center;padding:0 18px;font-size:clamp(32px,9vw,58px);line-height:.94;font-weight:1000;font-style:italic;letter-spacing:-.065em;color:#fff4e8;text-shadow:0 4px 0 #673018,0 0 35px #ff762955;opacity:0;transform:scale(.6) rotate(-5deg)}
.transition-overlay.is-answer .transition-impact{animation:impactLand .7s 1.85s cubic-bezier(.15,.8,.2,1) both}
.transition-overlay.score-6 .transition-impact{color:#ffe08a;text-shadow:0 4px 0 #713719,0 0 40px #ffd16699}
.transition-score{position:absolute;z-index:9;left:18px;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;opacity:0;transform:translateY(18px)}
.transition-overlay.is-answer .transition-score{animation:scoreReveal .5s 2.15s ease-out both}
.transition-score .score-small{font-size:10px;letter-spacing:.24em;font-weight:950;color:#c9bdb0}
.transition-score .score-big{font-size:clamp(54px,15vw,82px);font-weight:1000;letter-spacing:-.08em;line-height:1;margin:6px 0;color:#fff5e8}
.transition-score .score-tier{font-size:12px;letter-spacing:.14em;font-weight:1000;color:var(--gold)}
.transition-score .score-answer{font-size:13px;color:#d2c9be;margin-top:9px}
.transition-next{margin-top:17px;width:100%;max-width:420px;opacity:0;pointer-events:none;transform:translateY(12px)}
.transition-overlay.is-answer.ready .transition-next{animation:scoreReveal .35s ease-out both;pointer-events:auto}
.transition-overlay.is-answer .transition-next{position:relative}
.transition-overlay.is-answer .transition-score{bottom:calc(18px + env(safe-area-inset-bottom))}
.transition-overlay.is-answer .transition-impact{top:36%}
.transition-overlay.is-answer .transition-label{top:7%}
.transition-overlay.is-answer .transition-player{animation-duration:2.7s}
.transition-overlay.is-answer .transition-floor{animation-duration:3.35s}
.transition-overlay.is-answer .transition-ball{animation-duration:2.8s}
.transition-overlay.score-0 .transition-impact{color:#e8d8cc}

/* One continuous playable court: prompt, answer reveal, and travel all live in this same scene. */
.court-game{position:fixed;inset:0;z-index:90;overflow:hidden;isolation:isolate;background:#080a10;color:#fff5e8;--scene-a:#171c2a;--scene-b:#47301f;--accent:#ff7629;}
.court-game:before{content:"";position:absolute;inset:-8%;z-index:-3;background:radial-gradient(ellipse at 50% 18%,#f9d2a51c,transparent 28%),linear-gradient(180deg,#07090e 0 18%,var(--scene-a) 18% 48%,#17100e 100%);transition:background 1s;}
.court-game:after{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;opacity:0;background:#fff;mix-blend-mode:screen}
.court-game.scene-1{--scene-a:#222b35;--scene-b:#59402c;--accent:#93c8ff}.court-game.scene-2{--scene-a:#24313b;--scene-b:#6c3e28;--accent:#8ef0c0}.court-game.scene-3{--scene-a:#222138;--scene-b:#694326;--accent:#f3d36d}.court-game.scene-4{--scene-a:#29223c;--scene-b:#6e3826;--accent:#ff9a54}.court-game.scene-5{--scene-a:#34233a;--scene-b:#87451f;--accent:#ffd166}.court-game.scene-6{--scene-a:#201a34;--scene-b:#a34821;--accent:#ffe08a}
.court-game .scene-crowd{position:absolute;inset:0;z-index:-2;background:repeating-linear-gradient(90deg,transparent 0 20px,#bfc7d51b 21px 23px,transparent 24px 41px),linear-gradient(180deg,#06080c 0 20%,#151923 20% 43%,transparent 43%);mask-image:linear-gradient(#000 0 68%,transparent 90%);transform:scale(1.05);}
.court-game .scene-lights{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 9% 17%,#fff1c33c,transparent 16%),radial-gradient(ellipse at 91% 17%,#fff1c33c,transparent 16%),radial-gradient(ellipse at 50% 0%,#fff4df19,transparent 38%);}
.court-game .scene-floor{position:absolute;z-index:-1;left:-65%;width:230%;height:65%;bottom:-14%;transform:rotateX(64deg);transform-origin:bottom;background:repeating-linear-gradient(0deg,transparent 0 36px,#f6d6b37d 37px 39px,transparent 40px 74px),linear-gradient(90deg,transparent 49.5%,#f6d6b39c 49.8% 50.2%,transparent 50.5%),linear-gradient(90deg,#44271b,#a45b30 50%,#44271b);box-shadow:0 -20px 65px #ff8b3924;}
.court-game .court-arc{position:absolute;z-index:0;left:50%;top:51%;width:min(112vw,620px);aspect-ratio:1;border:2px solid #f4d1ac55;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 36px #f4d1ac08,0 0 0 75px #f4d1ac06;}
.court-game .hoop-real{position:absolute;z-index:2;top:13%;left:50%;width:min(74vw,350px);height:auto;transform:translateX(-50%);filter:drop-shadow(0 14px 18px #0008);transform-origin:50% 50%;}
.court-game .player-arms{position:absolute;z-index:5;left:50%;bottom:-8%;width:min(100vw,520px);height:47%;transform:translateX(-50%);pointer-events:none;}
.court-game .player-arms:before,.court-game .player-arms:after{content:"";position:absolute;bottom:0;width:30%;height:83%;background:linear-gradient(90deg,#111820,#b97751 28%,#e0a174 68%,#9d5b3b);border:2px solid #6d3d2c;border-radius:46% 46% 9% 9%;box-shadow:inset 8px 0 15px #f6c39c3b,0 -5px 24px #0008;}
.court-game .player-arms:before{left:8%;transform:rotate(-22deg);transform-origin:bottom right;clip-path:polygon(0 100%,8% 22%,28% 0,72% 6%,100% 100%)}.court-game .player-arms:after{right:8%;transform:rotate(22deg);transform-origin:bottom left;clip-path:polygon(0 100%,0 8%,35% 0,82% 22%,100% 100%)}

/* ===== THE RUN HUD ===== */
.rn{position:fixed;inset:0;z-index:90;background:#07080c;overflow:hidden;color:#fff5e8;-webkit-tap-highlight-color:transparent}
